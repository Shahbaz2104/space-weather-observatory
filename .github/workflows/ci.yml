name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    name: quality (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Compile
        run: python -m compileall -q src app.py pages scripts

      - name: Test
        run: pytest --cov=spaceweather --cov-report=term-missing

  container:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    name: container (Docker smoke)
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config -q

      - name: Build image
        run: docker build -t space-weather-observatory:ci .

      - name: Run offline container
        run: |
          docker run -d --name swo-ci \
            -e SWO_OFFLINE_MODE=true \
            -p 8501:8501 \
            space-weather-observatory:ci

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs swo-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f swo-ci || true
