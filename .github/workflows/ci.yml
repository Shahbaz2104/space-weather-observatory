name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Compile
        run: python -m compileall -q src app.py pages scripts

      - name: Test
        run: pytest --cov=spaceweather --cov-report=term-missing
