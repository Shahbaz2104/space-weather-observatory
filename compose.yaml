# Local container run for the observatory.
#
#   cp .env.example .env        # optional; Compose interpolates these values
#   docker compose up --build
#
# The image is built from ./Dockerfile and already runs as a non-root user with a
# health check on /_stcore/health. Named volumes keep the HTTP cache and exported
# artifacts outside the container so a restart does not redownload sources or lose
# a rendered animation.

services:
  observatory:
    build:
      context: .
      dockerfile: Dockerfile
    image: space-weather-observatory:local
    container_name: space-weather-observatory
    ports:
      - "8501:8501"
    environment:
      # Compose reads .env for interpolation; the defaults match config.Settings.
      SWO_OFFLINE_MODE: ${SWO_OFFLINE_MODE:-false}
      SWO_KP_STORM_THRESHOLD: ${SWO_KP_STORM_THRESHOLD:-5.0}
      SWO_HTTP_TIMEOUT_SECONDS: ${SWO_HTTP_TIMEOUT_SECONDS:-20}
      SWO_HTTP_RETRIES: ${SWO_HTTP_RETRIES:-3}
      SWO_CACHE_TTL_SECONDS: ${SWO_CACHE_TTL_SECONDS:-900}
      SWO_MAX_ANIMATION_FRAMES: ${SWO_MAX_ANIMATION_FRAMES:-600}
      SWO_NASA_ENABLED: ${SWO_NASA_ENABLED:-false}
      SWO_NASA_API_KEY: ${SWO_NASA_API_KEY:-}
    volumes:
      - cache:/app/data/cache
      - output:/app/output
    restart: unless-stopped

volumes:
  cache:
  output:
