[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "space-weather-observatory"
version = "0.1.0"
description = "An interactive, scientifically honest observatory for geomagnetic activity and solar-wind conditions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shahbaz" }]
keywords = ["space-weather", "geomagnetic", "kp-index", "solar-wind", "streamlit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "requests>=2.31",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "plotly>=5.22",
  "streamlit>=1.36",
  "pillow>=10.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-requests",
]

[project.urls]
Homepage = "https://github.com/Shahbaz2104/space-weather-observatory"
Repository = "https://github.com/Shahbaz2104/space-weather-observatory"
Issues = "https://github.com/Shahbaz2104/space-weather-observatory/issues"

[project.scripts]
swo-fetch = "spaceweather.cli:fetch_main"
swo-animate = "spaceweather.cli:animate_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "integration: tests that use the versioned genuine-data sample",
  "network: tests that require internet access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["spaceweather"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["spaceweather"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["spaceweather"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
